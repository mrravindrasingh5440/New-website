<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
  <div id="container">
            <img src="Food.jpg">
            <h3>Log in or sign up</h3>

     <a>Remember my login for faster sing-in</a>
  </div>
         <button href class="login-btn">Continue</button>

  <div class="text">
        <p id="line1"> By continuing, you agree to our</p>
        <p id="line2"> Terms of Service  &nbsp;Privacy Policy &nbsp; Content Policy</p>
          <p id="dot">..................................... &nbsp;................................ &nbsp;.................................. </p>
  </div>
          
  </div>
 <div class="xyz">
            <button id="googlebutton"><img id="google" src="Google.png"></button>
  </div>

  <div class="xxx">
            <button id="goo"><img id="sms" src="sms.png"></button>
  </div>
 

  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
  <script src="Script.js"></script>

</html>
