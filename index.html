<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="main">
        <div id="display">
            <div id="displayhied">
               <div id="scorecontainer">
                <div id="youscore">Your Score:😀</div>
                <div id="scoreval"></div>
               </div>
                 <div id="text">game over</div>
                 <button id="restart">Restart</button>
            </div>
            <div id="display-header">
                <div class="box">
                    <h2>Hit</h2>
                    <div id="hitval" class="recod"></div>
                </div>
                <div class="box">
                    <h2>Time</h2>
                    <div id="timer" class="recod">60</div>
                </div>
                <div class="box">
                    <h2>Score</h2>
                    <div id="score" class="recod">0</div>
                </div>
            </div>
            <div id="gamedisplay"> </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/all.min.js" integrity="sha512-4TkOavuOc65oG2lOTBdhfdLw9Bpr9tm0D53Kuk4rFVyV/RsXw5gmnYurKlwksWA9336K23TsgQhE0Mw568nKsw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
